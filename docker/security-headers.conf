# Shared security headers included in every location block
# (Prevents Nginx add_header inheritance override when Cache-Control is set)
#
# NOTE: If you enable an external RSVP webhook (e.g. Formspree, Web3Forms, or Google Apps Script),
# append its origin to `connect-src` below (e.g. `connect-src 'self' https://formspree.io;`).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://img.vietqr.io; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
